<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario recibido</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { border: none; border-radius: 16px; box-shadow: 0 4px 30px rgba(0,0,0,.08); max-width: 520px; }
.icon-circle { width: 72px; height: 72px; border-radius: 50%; background: #3d5a80; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px; }
</style>
</head>
<body>
<div class="card p-5 text-center">
    <div class="icon-circle"><i class="bi bi-check-lg"></i></div>
    <h3 class="fw-bold mb-2">¡Formulario recibido!</h3>
    <p class="text-muted mb-1">Gracias{% if name %}, <strong>{{ name }}</strong>{% endif %}.</p>
    <p class="text-muted mb-4">Vamos a revisar los datos y nos pondremos en contacto pronto para finalizar la configuración.</p>
    <a href="/onboarding" class="btn btn-outline-secondary">Volver al formulario</a>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
