{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #3d5a80, #293241); z-index: 50;">
    <div class="card shadow w-100 login-form" style="max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                {% if logo_url %}
                <img src="{{ url_for('static', filename=logo_url) }}" class="mb-2" style="height:48px;">
                {% endif %}
                <h4 class="mb-0">{{ business_name }}</h4>
            </div>
            <p class="text-center text-muted mb-4">Ingresá tus credenciales</p>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-floating mb-3">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Usuario" required autofocus>
                    <label for="username">Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
