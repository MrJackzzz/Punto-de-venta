{% extends "base.html" %}
{% block title %}Historial{% endblock %}
{% block content %}
<h2 class="text-primary mb-3">Historial de Movimientos</h2>

<div class="row row-cols-1 row-cols-md-3 g-3 mb-3" id="summaryCards"></div>

<div class="card shadow-sm mb-3">
    <div class="card-header">Filtros</div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-3">
                <label for="filterUser" class="form-label">Usuario</label>
                <select id="filterUser" class="form-select" onchange="applyFilters()">
                    <option value="">Todos</option>
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }} ({{ u.role }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label for="filterAction" class="form-label">Acción</label>
                <select id="filterAction" class="form-select" onchange="applyFilters()">
                    <option value="">Todas</option>
                    <option value="sale">Venta</option>
                    <option value="product_create">Crear Producto</option>
                    <option value="product_edit">Editar Producto</option>
                    <option value="product_delete">Eliminar Producto</option>
                    <option value="supplier_create">Crear Proveedor</option>
                    <option value="supplier_edit">Editar Proveedor</option>
                    <option value="supplier_delete">Eliminar Proveedor</option>
                    <option value="user_create">Crear Usuario</option>
                    <option value="user_toggle">Estado Usuario</option>
                    <option value="user_reset_pass">Reset Pass</option>
                    <option value="login">Inicio Sesión</option>
                    <option value="logout">Cierre Sesión</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filterDateFrom" class="form-label">Desde</label>
                <input type="date" id="filterDateFrom" class="form-control" onchange="applyFilters()">
            </div>
            <div class="col-md-3">
                <label for="filterDateTo" class="form-label">Hasta</label>
                <input type="date" id="filterDateTo" class="form-control" onchange="applyFilters()">
            </div>
        </div>
        <div class="d-flex gap-2 flex-wrap mt-3">
            <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Limpiar filtros</button>
            <a href="javascript:exportCSV()" class="btn btn-primary btn-sm"><i class="bi bi-download"></i> CSV</a>
            <a href="javascript:exportPDF()" class="btn btn-secondary btn-sm"><i class="bi bi-file-text"></i> PDF</a>
            <span class="small text-muted align-self-center" id="resultCount"></span>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acción</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="text-center mt-2 small text-muted pb-2" id="liveIndicator">● Actualizando...</div>
</div>

<div id="saleDetailModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <span id="saleDetailTitle" class="modal-title fs-5">Detalle de Venta</span>
                <button type="button" class="btn-close" onclick="closeModal('saleDetailModal')"></button>
            </div>
            <div class="modal-body" id="saleDetailBody"></div>
            <div class="modal-footer d-flex flex-wrap gap-2">
                <button class="btn btn-primary flex-fill" onclick="printSaleTicket()" style="min-width:120px;"><i class="bi bi-printer"></i> Imprimir</button>
                <button class="btn btn-success flex-fill" onclick="shareSaleWhatsApp()" style="min-width:120px;"><i class="bi bi-whatsapp"></i> WhatsApp</button>
                <button class="btn btn-secondary flex-fill" onclick="toggleSaleEmail()" style="min-width:120px;"><i class="bi bi-envelope"></i> Email</button>
                <button class="btn btn-secondary flex-fill" onclick="closeModal('saleDetailModal')" style="min-width:80px;">Cerrar</button>
            </div>
            <div id="saleEmailArea" class="px-3 pb-3" style="display:none;">
                <div class="d-flex gap-2">
                    <input type="email" id="saleEmailInput" class="form-control" placeholder="cliente@email.com">
                    <button class="btn btn-primary btn-sm" onclick="sendSaleEmail()">Enviar</button>
                </div>
                <div id="saleEmailMsg" class="small mt-1"></div>
            </div>
        </div>
    </div>
</div>

<div id="logDetailModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <span id="logDetailTitle" class="modal-title fs-5">Detalle del Movimiento</span>
                <button type="button" class="btn-close" onclick="closeModal('logDetailModal')"></button>
            </div>
            <div class="modal-body" id="logDetailBody"></div>
        </div>
    </div>
</div>

<script>
const actionMap = {
    'login': 'Inicio Sesión', 'logout': 'Cierre Sesión',
    'product_create': 'Crear Producto', 'product_edit': 'Editar Producto',
    'product_delete': 'Eliminar Producto', 'sale': 'Venta',
    'supplier_create': 'Crear Proveedor', 'supplier_edit': 'Editar Proveedor',
    'supplier_delete': 'Eliminar Proveedor', 'user_create': 'Crear Usuario',
    'user_toggle': 'Estado Usuario', 'user_reset_pass': 'Reset Pass'
};

let lastViewedSale = null;

function viewSale(saleId) {
    fetch('/api/sale/' + saleId + '/items')
        .then(r => r.json())
        .then(data => {
            lastViewedSale = data;
            const methodNames = {'cash': 'Efectivo', 'card': 'Tarjeta', 'transfer': 'Transferencia'};
            let html = `
                <div class="mb-2 small">
                    <strong>#${data.id}</strong> | ${data.date}<br>
                    Atendió: <strong>${data.user}</strong><br>
                    Método: ${methodNames[data.payment_method] || data.payment_method}<br>
                    <span class="fs-5 fw-bold text-primary">Total: ${fmt(data.total)}</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Producto</th><th>Cant</th><th>P/U</th><th>Subtotal</th></tr></thead>
                        <tbody>
            `;
            data.items.forEach(item => {
                html += `<tr><td>${item.product_name}</td><td>${item.quantity}</td><td>${fmt(item.unit_price)}</td><td>${fmt(item.subtotal)}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('saleDetailBody').innerHTML = html;
            document.getElementById('saleDetailTitle').innerHTML = '<i class="bi bi-receipt"></i> Venta #' + data.id;
            openModal('saleDetailModal');
        });
}

function shareSaleWhatsApp() {
    if (!lastViewedSale) return;
    const bizName = '{{ business_name }}';
    const url = window.location.origin + '/ticket/' + lastViewedSale.id;
    const msg = '*' + bizName + '* - Ticket #' + lastViewedSale.id + '\nTotal: ' + fmt(lastViewedSale.total) + '\n<i class="bi bi-link-45deg"></i> ' + url;
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function printSaleTicket() {
    if (!lastViewedSale) return;
    const win = window.open('/ticket/' + lastViewedSale.id, '_blank');
    if (win) {
        win.onload = function() { setTimeout(function() { win.print(); }, 300); };
    }
}

function toggleSaleEmail() {
    const area = document.getElementById('saleEmailArea');
    area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function sendSaleEmail() {
    const email = document.getElementById('saleEmailInput').value.trim();
    const msgEl = document.getElementById('saleEmailMsg');
    if (!email) { msgEl.textContent = 'Ingresá un email'; msgEl.style.color = 'var(--accent)'; return; }
    msgEl.textContent = 'Enviando...';
    msgEl.style.color = 'var(--gray)';
    fetch('/api/sale/' + lastViewedSale.id + '/send-email', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            msgEl.textContent = 'Error: ' + data.error;
            msgEl.style.color = 'var(--danger)';
        } else {
            msgEl.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> Ticket enviado a ' + email;
            msgEl.style.color = 'var(--success)';
            document.getElementById('saleEmailInput').value = '';
        }
    })
    .catch(() => {
        msgEl.textContent = 'Error al enviar';
        msgEl.style.color = 'var(--danger)';
    });
}

function getFilters() {
    const params = new URLSearchParams();
    const user = document.getElementById('filterUser').value;
    const action = document.getElementById('filterAction').value;
    const from = document.getElementById('filterDateFrom').value;
    const to = document.getElementById('filterDateTo').value;
    if (user) params.set('user_id', user);
    if (action) params.set('action', action);
    if (from) params.set('date_from', from);
    if (to) params.set('date_to', to);
    return params;
}

function applyFilters() {
    fetch('/api/history?' + getFilters().toString())
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('logsBody');
            const indicator = document.getElementById('liveIndicator');
            const countEl = document.getElementById('resultCount');

            if (!data.logs.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Sin resultados</td></tr>';
                countEl.textContent = '0 movimientos';
            } else {
                tbody.innerHTML = data.logs.map(log => {
                    let extra = ` onclick="viewLog(${log.id})" style="cursor:pointer;" title="Click para ver detalle"`;
                    return `<tr${extra}>
                        <td>${log.time}</td>
                        <td>${log.user}</td>
                        <td><span class="badge bg-${log.role}">${log.role.toUpperCase()}</span></td>
                        <td>${log.action}</td>
                        <td>${log.description}</td>
                    </tr>`;
                }).join('');
                countEl.textContent = data.summary.total_logs + ' movimientos';
            }
            indicator.textContent = '● Actualizado ' + new Date().toLocaleTimeString();

            const summaryEl = document.getElementById('summaryCards');
            summaryEl.innerHTML = `
                <div class="col">
                    <div class="card shadow-sm text-center p-3">
                        <div class="fs-3 fw-bold">${data.summary.total_logs}</div>
                        <div class="text-muted small">Movimientos</div>
                    </div>
                </div>
                <div class="col">
                    <div class="card shadow-sm text-center p-3 border-success">
                        <div class="fs-3 fw-bold text-success">${fmt(data.summary.total_sales_amount)}</div>
                        <div class="text-muted small">Total vendido (${data.summary.sale_count} ventas)</div>
                    </div>
                </div>
                <div class="col">
                    <div class="card shadow-sm text-center p-3">
                        <div class="fs-3 fw-bold">${data.summary.total_sales_qty}</div>
                        <div class="text-muted small">Unidades vendidas</div>
                    </div>
                </div>
            `;
        });
}

function clearFilters() {
    document.getElementById('filterUser').value = '';
    document.getElementById('filterAction').value = '';
    document.getElementById('filterDateFrom').value = '';
    document.getElementById('filterDateTo').value = '';
    applyFilters();
}

function viewLog(logId) {
    fetch('/api/log/' + logId)
        .then(r => r.json())
        .then(data => {
            if (data.sale_id) {
                viewSale(data.sale_id);
                return;
            }
            const actionNames = {
                'login': 'Inicio Sesión', 'logout': 'Cierre Sesión',
                'product_create': 'Crear Producto', 'product_edit': 'Editar Producto',
                'product_delete': 'Eliminar Producto', 'sale': 'Venta',
                'supplier_create': 'Crear Proveedor', 'supplier_edit': 'Editar Proveedor',
                'supplier_delete': 'Eliminar Proveedor', 'user_create': 'Crear Usuario',
                'user_toggle': 'Estado Usuario', 'user_reset_pass': 'Reset Pass'
            };
            let html = `
                <div class="mb-2 small">
                    <strong>${data.time}</strong><br>
                    Usuario: <strong>${data.user}</strong> (${data.role.toUpperCase()})<br>
                    Acción: <strong>${actionNames[data.action] || data.action}</strong>
                </div>
            `;
            if (data.changes && data.changes.length) {
                html += `<div class="mb-1 fw-semibold">Producto: ${data.product_name}</div>`;
                html += `<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Campo</th><th>Valor anterior</th><th>Valor nuevo</th></tr></thead><tbody>`;
                data.changes.forEach(c => {
                    html += `<tr><td>${c.field}</td><td class="text-secondary">${c.old}</td><td class="text-success fw-semibold">${c.new}</td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else {
                html += `<div class="p-3 bg-light rounded-3">${data.description}</div>`;
            }
            document.getElementById('logDetailBody').innerHTML = html;
            document.getElementById('logDetailTitle').innerHTML = '<i class="bi bi-journal-text"></i> ' + (actionNames[data.action] || data.action);
            openModal('logDetailModal');
        });
}

function exportCSV() {
    window.location.href = '/history/export?' + getFilters().toString();
}

function exportPDF() {
    window.open('/history/pdf?' + getFilters().toString(), '_blank');
}

applyFilters();
setInterval(applyFilters, 5000);
</script>
{% endblock %}
