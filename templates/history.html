{% extends "base.html" %}
{% block title %}Historial{% endblock %}
{% block content %}
<h2 style="color:var(--primary);margin-bottom:1rem;">Historial de Movimientos</h2>

<div class="grid grid-3" id="summaryCards" style="margin-bottom:1rem;"></div>

<div class="card">
    <div class="card-header">Filtros</div>
    <div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:0.8rem;">
        <div class="form-group">
            <label for="filterUser">Usuario</label>
            <select id="filterUser" class="form-control" onchange="applyFilters()">
                <option value="">Todos</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.username }} ({{ u.role }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="filterAction">Acción</label>
            <select id="filterAction" class="form-control" onchange="applyFilters()">
                <option value="">Todas</option>
                <option value="sale">Venta</option>
                <option value="product_create">Crear Producto</option>
                <option value="product_edit">Editar Producto</option>
                <option value="product_delete">Eliminar Producto</option>
                <option value="supplier_create">Crear Proveedor</option>
                <option value="supplier_edit">Editar Proveedor</option>
                <option value="supplier_delete">Eliminar Proveedor</option>
                <option value="user_create">Crear Usuario</option>
                <option value="user_toggle">Estado Usuario</option>
                <option value="user_reset_pass">Reset Pass</option>
                <option value="login">Inicio Sesión</option>
                <option value="logout">Cierre Sesión</option>
            </select>
        </div>
        <div class="form-group">
            <label for="filterDateFrom">Desde</label>
            <input type="date" id="filterDateFrom" class="form-control" onchange="applyFilters()">
        </div>
        <div class="form-group">
            <label for="filterDateTo">Hasta</label>
            <input type="date" id="filterDateTo" class="form-control" onchange="applyFilters()">
        </div>
    </div>
    <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
        <button class="btn btn-sm btn-secondary" onclick="clearFilters()">Limpiar filtros</button>
        <a href="javascript:exportCSV()" class="btn btn-sm btn-primary">📥 CSV</a>
        <a href="javascript:exportPDF()" class="btn btn-sm btn-secondary">📄 PDF</a>
        <span style="font-size:0.85rem;color:var(--gray);align-self:center;" id="resultCount"></span>
    </div>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acción</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr><td colspan="5" style="text-align:center;color:var(--gray);">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <div style="text-align:center;margin-top:0.5rem;font-size:0.8rem;color:var(--gray);" id="liveIndicator">● Actualizando...</div>
</div>

<div id="saleDetailModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
            <span id="saleDetailTitle">Detalle de Venta</span>
            <button class="modal-close" onclick="closeModal('saleDetailModal')">&times;</button>
        </div>
        <div id="saleDetailBody"></div>
    </div>
</div>

<div id="logDetailModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
            <span id="logDetailTitle">Detalle del Movimiento</span>
            <button class="modal-close" onclick="closeModal('logDetailModal')">&times;</button>
        </div>
        <div id="logDetailBody"></div>
    </div>
</div>

<script>
const actionMap = {
    'login': 'Inicio Sesión', 'logout': 'Cierre Sesión',
    'product_create': 'Crear Producto', 'product_edit': 'Editar Producto',
    'product_delete': 'Eliminar Producto', 'sale': 'Venta',
    'supplier_create': 'Crear Proveedor', 'supplier_edit': 'Editar Proveedor',
    'supplier_delete': 'Eliminar Proveedor', 'user_create': 'Crear Usuario',
    'user_toggle': 'Estado Usuario', 'user_reset_pass': 'Reset Pass'
};

function viewSale(saleId) {
    fetch('/api/sale/' + saleId + '/items')
        .then(r => r.json())
        .then(data => {
            const methodNames = {'cash': 'Efectivo', 'card': 'Tarjeta', 'transfer': 'Transferencia'};
            let html = `
                <div style="margin-bottom:1rem;font-size:0.9rem;">
                    <strong>#${data.id}</strong> | ${data.date}<br>
                    Atendió: <strong>${data.user}</strong><br>
                    Método: ${methodNames[data.payment_method] || data.payment_method}<br>
                    <span style="font-size:1.2rem;font-weight:700;color:var(--primary);">Total: $${data.total.toFixed(2)}</span>
                </div>
                <table class="table">
                    <thead><tr><th>Producto</th><th>Cant</th><th>P/U</th><th>Subtotal</th></tr></thead>
                    <tbody>
            `;
            data.items.forEach(item => {
                html += `<tr><td>${item.product_name}</td><td>${item.quantity}</td><td>$${item.unit_price.toFixed(2)}</td><td>$${item.subtotal.toFixed(2)}</td></tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('saleDetailBody').innerHTML = html;
            document.getElementById('saleDetailTitle').textContent = '🧾 Venta #' + data.id;
            openModal('saleDetailModal');
        });
}

function getFilters() {
    const params = new URLSearchParams();
    const user = document.getElementById('filterUser').value;
    const action = document.getElementById('filterAction').value;
    const from = document.getElementById('filterDateFrom').value;
    const to = document.getElementById('filterDateTo').value;
    if (user) params.set('user_id', user);
    if (action) params.set('action', action);
    if (from) params.set('date_from', from);
    if (to) params.set('date_to', to);
    return params;
}

function applyFilters() {
    fetch('/api/history?' + getFilters().toString())
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('logsBody');
            const indicator = document.getElementById('liveIndicator');
            const countEl = document.getElementById('resultCount');

            if (!data.logs.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray);">Sin resultados</td></tr>';
                countEl.textContent = '0 movimientos';
            } else {
                tbody.innerHTML = data.logs.map(log => {
                    let extra = ` onclick="viewLog(${log.id})" style="cursor:pointer;" title="Click para ver detalle"`;
                    return `<tr${extra}>
                        <td>${log.time}</td>
                        <td>${log.user}</td>
                        <td><span class="badge badge-${log.role}">${log.role.toUpperCase()}</span></td>
                        <td>${log.action}</td>
                        <td>${log.description}</td>
                    </tr>`;
                }).join('');
                countEl.textContent = data.summary.total_logs + ' movimientos';
            }
            indicator.textContent = '● Actualizado ' + new Date().toLocaleTimeString();

            const summaryEl = document.getElementById('summaryCards');
            summaryEl.innerHTML = `
                <div class="stat-card">
                    <div class="number">${data.summary.total_logs}</div>
                    <div class="label">Movimientos</div>
                </div>
                <div class="stat-card success">
                    <div class="number">$${data.summary.total_sales_amount.toFixed(2)}</div>
                    <div class="label">Total vendido (${data.summary.sale_count} ventas)</div>
                </div>
                <div class="stat-card">
                    <div class="number">${data.summary.total_sales_qty}</div>
                    <div class="label">Unidades vendidas</div>
                </div>
            `;
        });
}

function clearFilters() {
    document.getElementById('filterUser').value = '';
    document.getElementById('filterAction').value = '';
    document.getElementById('filterDateFrom').value = '';
    document.getElementById('filterDateTo').value = '';
    applyFilters();
}

function viewLog(logId) {
    fetch('/api/log/' + logId)
        .then(r => r.json())
        .then(data => {
            if (data.sale_id) {
                viewSale(data.sale_id);
                return;
            }
            const actionNames = {
                'login': 'Inicio Sesión', 'logout': 'Cierre Sesión',
                'product_create': 'Crear Producto', 'product_edit': 'Editar Producto',
                'product_delete': 'Eliminar Producto', 'sale': 'Venta',
                'supplier_create': 'Crear Proveedor', 'supplier_edit': 'Editar Proveedor',
                'supplier_delete': 'Eliminar Proveedor', 'user_create': 'Crear Usuario',
                'user_toggle': 'Estado Usuario', 'user_reset_pass': 'Reset Pass'
            };
            let html = `
                <div style="margin-bottom:1rem;font-size:0.9rem;">
                    <strong>${data.time}</strong><br>
                    Usuario: <strong>${data.user}</strong> (${data.role.toUpperCase()})<br>
                    Acción: <strong>${actionNames[data.action] || data.action}</strong>
                </div>
            `;
            if (data.changes && data.changes.length) {
                html += `<div style="margin-bottom:0.5rem;font-weight:600;">Producto: ${data.product_name}</div>`;
                html += `<table class="table"><thead><tr><th>Campo</th><th>Valor anterior</th><th>Valor nuevo</th></tr></thead><tbody>`;
                data.changes.forEach(c => {
                    html += `<tr><td>${c.field}</td><td style="color:#999;">${c.old}</td><td style="color:var(--success);font-weight:600;">${c.new}</td></tr>`;
                });
                html += `</tbody></table>`;
            } else {
                html += `<div style="padding:1rem;background:var(--bg);border-radius:8px;">${data.description}</div>`;
            }
            document.getElementById('logDetailBody').innerHTML = html;
            document.getElementById('logDetailTitle').textContent = '📋 ' + (actionNames[data.action] || data.action);
            openModal('logDetailModal');
        });
}

function exportCSV() {
    window.location.href = '/history/export?' + getFilters().toString();
}

function exportPDF() {
    window.open('/history/pdf?' + getFilters().toString(), '_blank');
}

applyFilters();
setInterval(applyFilters, 5000);
</script>
{% endblock %}
